<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Matrice — Game Dashboard</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="./index.html" class="nav-logo">
        <img src="./resources/logo.svg" width="20" height="20" alt="GronouilleTracker" />
        GronouilleTracker
      </a>
      <nav aria-label="Navigation principale">
        <ul class="nav-links">
          <li><a href="./index.html">Jeux</a></li>
          <li><a href="./matrix.html" class="active">Tracker</a></li>
          <li><a href="./history.html">Historique</a></li>
          <li><a href="./guide.html">Guide</a></li>
        </ul>
      </nav>
      <button class="theme-btn" data-theme-toggle aria-label="Basculer le thème"></button>
    </div>
  </header>

  <main>
    <div class="page-header">
      <div>
        <h1>Tracker de joueur</h1>
        <p>Résumé des performances.</p>
      </div>
    </div>

    <div class="card matrix-wrap">
      <table class="matrix-table" id="mtable" aria-label="Matrice"></table>
    </div>
  </main>

  <footer><p>GronouilleTracker &mdash; <span id="yr"></span></p></footer>

  <script>
  // ── Modifiez les lignes, colonnes et données ici ─────────
  const ROWS = ['Mécaniques', 'Graphismes', 'Son', 'Narration', 'Multijoueur', 'Modding'];
  const COLS = ['Project Alpha', 'DiceMaster', 'WorldForge', 'CombatGrid', 'PixelDungeon 2'];

  // Clé : "Ligne||Colonne"  —  laissez '' pour une case vide
  const DATA = {
    'Mécaniques||Project Alpha':  'Tour par tour',
    'Mécaniques||DiceMaster':     'Dés + stratégie',
    'Mécaniques||CombatGrid':     'Grille tactique',
    'Graphismes||WorldForge':     '3D low-poly',
    'Graphismes||PixelDungeon 2': 'Pixel art',
    'Son||Project Alpha':         'OST originale',
    'Narration||Project Alpha':   'Dialogues',
    'Narration||WorldForge':      'Lore écrit',
    'Multijoueur||CombatGrid':    '2–4 joueurs',
    'Modding||DiceMaster':        'API publique',
    'Modding||PixelDungeon 2':    'Moddable',
  };
  // ─────────────────────────────────────────────────────────

  function build() {
    const t = document.getElementById('mtable');
    let html = '<thead><tr><th class="row-header">↓ / →</th>';
    COLS.forEach(c => { html += `<th class="col-header">${c}</th>`; });
    html += '</tr></thead><tbody>';
    ROWS.forEach(row => {
      html += `<tr><td class="row-label">${row}</td>`;
      COLS.forEach(col => {
        const val = DATA[`${row}||${col}`] || '';
        html += `<td class="matrix-cell">${val}</td>`;
      });
      html += '</tr>';
    });
    html += '</tbody>';
    t.innerHTML = html;
  }

  document.getElementById('yr').textContent = new Date().getFullYear();
  build();

  // Theme toggle
  (function(){
    const btn  = document.querySelector('[data-theme-toggle]');
    const root = document.documentElement;
    let theme  = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', theme);
    const moon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const sun  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
    const upd  = () => btn.innerHTML = theme === 'dark' ? sun : moon;
    upd();
    btn.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', theme);
      upd();
    });
  })();
  </script>
</body>
</html>
