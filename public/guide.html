<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Guide — GronouilleTracker</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="./index.html" class="nav-logo">
        <img src="./resources/logo.svg" width="20" height="20" alt="GronouilleTracker" />
        GronouilleTracker
      </a>
      <nav aria-label="Navigation principale">
        <ul class="nav-links">
          <li><a href="./index.html">Jeux</a></li>
          <li><a href="./matrix.html">Tracker</a></li>
          <li><a href="./history.html">Historique</a></li>
          <li><a href="./guide.html" class="active">Guide</a></li>
        </ul>
      </nav>
      <button class="theme-btn" data-theme-toggle aria-label="Basculer le thème"></button>
    </div>
  </header>

  <main>
    <!-- ── Liens utiles ── -->
    <section aria-labelledby="useful-links-title">
      <h2 id="useful-links-title" class="section-label">Liens utiles</h2>
      <div class="useful-links-row">

        <div><a href="https://github.com/ArchipelagoMW/Archipelago/releases" target="_blank" rel="noopener noreferrer" class="useful-link-card">
          <span class="useful-link-icon">
          </span>
          <span class="useful-link-body">
            <span class="useful-link-title">Archipelago Client</span>
          </span>
        </a></div>

        <div><a href="https://github.com/black-sliver/PopTracker/releases/" target="_blank" rel="noopener noreferrer" class="useful-link-card">
          <span class="useful-link-icon">
          </span>
          <span class="useful-link-body">
            <span class="useful-link-title">PopTracker</span>
          </span>
        </a></div>
        

      </div>
    </section>

    <!-- ── Guides ── -->
    <section aria-labelledby="guides-title" style="margin-top: var(--sp-10)">
      <h2 id="guides-title" class="section-label">Guides</h2>
      <div class="guide-list">
        <div>
          <a href="./guide/poptracker-add-packs.html" class="guide-card">
            <span class="guide-card-body">
              <span class="guide-card-title">Ajouter des packs à PopTracker</span>
            </span>
          </a>
        </div>

        <div>
          <a href="./guide/discord-custom.html" class="guide-card">
            <span class="guide-card-body">
              <span class="guide-card-title">Trouver les channels custom sur le discord</span>
            </span>
          </a>
        </div>

      </div>
    </section>

  </main>

  <footer><p>GronouilleTracker &mdash; <span id="yr"></span></p></footer>

  <script>
  document.getElementById('yr').textContent = new Date().getFullYear();
  (function(){
    const btn  = document.querySelector('[data-theme-toggle]');
    const root = document.documentElement;
    let theme  = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', theme);
    const moon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const sun  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
    const upd  = () => btn.innerHTML = theme === 'dark' ? sun : moon;
    upd();
    btn.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', theme);
      upd();
    });
  })();
  </script>
</body>
</html>
