<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Historique — Game Dashboard</title>
  <link rel="preconnect" href="https://api.fontshare.com" />
  <link href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@700,800&f[]=satoshi@400,500,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="./index.html" class="nav-logo">
        <img src="./resources/logo.svg" width="20" height="20" alt="GronouilleTracker" />
        GronouilleTracker
      </a>
      <nav aria-label="Navigation principale">
        <ul class="nav-links">
          <li><a href="./index.html">Jeux</a></li>
          <li><a href="./matrix.html">Tracker</a></li>
          <li><a href="./history.html" class="active">Historique</a></li>
        </ul>
      </nav>
      <button class="theme-btn" data-theme-toggle aria-label="Basculer le thème"></button>
    </div>
  </header>

  <main>

    <!-- ── Vue liste ── -->
    <div id="view-list">
      <div class="page-header">
        <div>
          <h1>Historique</h1>
          <p>Toutes les sessions de jeu enregistrées.</p>
        </div>
      </div>

      <div class="card">
        <table class="game-table" aria-label="Historique des sessions">
          <thead>
            <tr>
              <th style="width:80px">#</th>
              <th>Date</th>
              <th>Joueurs</th>
              <th>Jeux</th>
              <th style="width:48px"></th>
            </tr>
          </thead>
          <tbody id="session-list"></tbody>
        </table>
      </div>
    </div>

    <!-- ── Vue détail ── -->
    <div id="view-detail" style="display:none">
      <div class="page-header">
        <div>
          <button class="btn btn-ghost" onclick="showList()">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
              <path d="M19 12H5M12 5l-7 7 7 7"/>
            </svg>
            Retour
          </button>
          <h1 id="detail-title" style="margin-top:var(--sp-3)"></h1>
          <p id="detail-subtitle" style="color:var(--tx-muted);font-size:var(--text-sm)"></p>
        </div>
      </div>

      <div class="detail-grid" id="detail-grid"></div>
    </div>

  </main>

  <footer><p>GronouilleTracker &mdash; <span id="yr"></span></p></footer>

  <script>
  let SESSIONS = [];

  function fmt(dateStr) {
    return new Date(dateStr + 'T00:00:00').toLocaleDateString('fr-FR', { day:'numeric', month:'long', year:'numeric' });
  }

  function toMinutes(str) {
    if (!str) return 0;
    let total = 0;
    const h = str.match(/(\d+)h/);
    if (h) total += parseInt(h[1]) * 60;
    const m = str.match(/h(\d+)/);
    if (m) total += parseInt(m[1]);
    return total || (parseInt(str) * 60);
  }


  function gameTagsHtml(games) {
    return games.map(g => `<span class="session-game-tag">${g}</span>`).join('');
  }

  function buildList() {
    const tb = document.getElementById('session-list');
    if (!SESSIONS.length) {
      tb.innerHTML = `<tr><td colspan="5"><div class="empty">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
        <h3>Aucune session</h3><p>Ajoutez des entrées dans history.json.</p>
      </div></td></tr>`;
      return;
    }
    tb.innerHTML = SESSIONS.map(s => `
      <tr class="session-row" onclick="showDetail(${s.id})" role="button" tabindex="0"
          onkeydown="if(event.key==='Enter')showDetail(${s.id})">
        <td><span class="session-num">#${String(s.id).padStart(3,'0')}</span></td>
        <td style="color:var(--tx-muted);font-size:var(--text-sm);white-space:nowrap">${fmt(s.date)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:var(--sp-2)">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
              <circle cx="9" cy="7" r="4"/>
              <path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/>
            </svg>
            <span style="font-weight:600">${s.players}</span>
          </div>
        </td>
        <td><div class="session-games-wrap">${Array.isArray(s.games) ? s.games.join('; ') : (s.games || '')}</div></td>
        <td>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2" style="color:var(--tx-faint);margin-left:auto;display:block" aria-hidden="true">
            <path d="M9 18l6-6-6-6"/>
          </svg>
        </td>
      </tr>`).join('');
  }

  function showDetail(id) {
    const s = SESSIONS.find(x => x.id === id);
    if (!s) return;

    document.getElementById('detail-title').textContent    = `Session #${String(s.id).padStart(3,'0')}`;
    document.getElementById('detail-subtitle').textContent = fmt(s.date) + (s.seed ? `  ·  Seed : ${s.seed}` : '');

    const summary = s.summary || [];
    const durations  = summary.map(p => toMinutes(p['Temps de completion']));
    const totalMorts  = summary.reduce((acc, p) => acc + (p['Nombre de morts'] || 0), 0);
    const mostDeaths  = summary.length ? summary.reduce((a,b) => a['Nombre de morts'] > b['Nombre de morts'] ? a : b) : null;
    const leastDeaths = summary.length ? summary.reduce((a,b) => a['Nombre de morts'] < b['Nombre de morts'] ? a : b) : null;
    const maxDeaths   = mostDeaths ? mostDeaths['Nombre de morts'] : 1;

    const grid = document.getElementById('detail-grid');
    grid.innerHTML = '';

    // ── GLOBAL ──
    const cardGlobal = document.createElement('div');
    cardGlobal.className = 'card detail-card detail-card-full';
    cardGlobal.innerHTML = `
      <div class="detail-card-header detail-card-header-section">
        <h2>Détails de la session</h2>
      </div>
      <div class="detail-section-body">

        <dl class="flat-dl">
          <div class="flat-dl-row">
            <dt>Date</dt><dd>${fmt(s.date)}</dd>
          </div>
          <div class="flat-dl-row">
            <dt>Durée de la session</dt><dd>20h</dd>
          </div>
          <div class="flat-dl-row">
            <dt>Joueurs</dt><dd>${s.players}</dd>
          </div>
          ${s.seed ? `<div class="flat-dl-row"><dt>Seed</dt><dd class="kpi-mono">${s.seed}</dd></div>` : ''}
        </dl>

        <br>
        <h2 class="detail-sub-header">Résumé des performances</h2>
        <table class="game-table">
          <thead>
            <tr>
              <th>Joueur</th>
              <th>Jeu</th>
              <th>Durée</th>
              <th>Objectif</th>
            </tr>
          </thead>
          <tbody>
            ${summary.map(p => `
              <tr>
                <td style="font-weight:600">${p.player}</td>
                <td>${p['Jeu']}</td>
                <td style="font-variant-numeric:tabular-nums">${p['Temps de completion']}</td>
                <td>${p['Objectif'] || '—'}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>`;
    grid.appendChild(cardGlobal);

    // ── MORTS ──
    const cardMorts = document.createElement('div');
    cardMorts.className = 'card detail-card detail-card-full';
    cardMorts.innerHTML = `

      <div class="detail-section-body">
        <br>
        <h2 class="detail-sub-header">DeathLink</h2>
        <dl class="flat-dl">
          <div class="flat-dl-row flat-dl-danger">
            <dt>Plus de morts</dt>
            <dd>${mostDeaths ? `${mostDeaths.player} : ${mostDeaths['Nombre de morts']}` : '—'}</dd>
          </div>
          <div class="flat-dl-row flat-dl-success">
            <dt>Moins de morts</dt>
            <dd>${leastDeaths ? `${leastDeaths.player} : ${leastDeaths['Nombre de morts']}` : '—'}</dd>
          </div>
          <div class="flat-dl-row">
            <dt>Total</dt>
            <dd>${totalMorts}</dd>
          </div>
        </dl>

      </div>`;
    grid.appendChild(cardMorts);

    document.getElementById('view-list').style.display   = 'none';
    document.getElementById('view-detail').style.display = 'block';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function showList() {
    document.getElementById('view-detail').style.display = 'none';
    document.getElementById('view-list').style.display   = 'block';
  }

  async function loadSessions() {
    try {
      const res = await fetch('./history.json');
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      SESSIONS = await res.json();
    } catch (err) {
      console.error('Impossible de charger history.json :', err);
      SESSIONS = [];
    }
    buildList();
  }

  document.getElementById('yr').textContent = new Date().getFullYear();
  loadSessions();

  // Theme toggle
  (function(){
    const btn  = document.querySelector('[data-theme-toggle]');
    const root = document.documentElement;
    let theme  = matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light';
    root.setAttribute('data-theme', theme);
    const moon = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>`;
    const sun  = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>`;
    const upd  = () => btn.innerHTML = theme === 'dark' ? sun : moon;
    upd();
    btn.addEventListener('click', () => {
      theme = theme === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', theme);
      upd();
    });
  })();
  </script>
</body>
</html>
